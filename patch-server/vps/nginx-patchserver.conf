server {
    listen 8790;
    server_name _;

    root /var/www/hero-patches/repo;
    index channels/test.json;

    # Performance para arquivos estáticos grandes
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Habilita CORS para o launcher
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
    add_header Access-Control-Allow-Headers * always;

    # Tipos MIME adicionais
    types {
        application/json                    json;
        application/zstd                    zst;
        application/octet-stream            bin dat;
        application/vnd.microsoft.portable-executable exe;
    }

    # Desativa compressão gzip para arquivos já compactados com zstd
    gzip off;

    # Canais e notícias: sempre atualizados (sem cache no cliente/proxy)
    location ~* /(channels/|news\.json$) {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Manifestos e Chunks: imutáveis por hash SHA-256 (cache agressivo de 1 ano)
    location ~* /(manifests/|chunks/) {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Binários do launcher e executáveis
    location ~* \.exe$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin * always;
    }

    # Bloqueia acesso a arquivos ocultos ou locks
    location ~ /\. {
        deny all;
    }
}
